<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Email OTP Authentication</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h1>Login</h1>
    <p class="subtitle">Sign in with a one-time code sent to your email.</p>

    <!-- Step 1: Email entry -->
    <div id="email-step">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="you@example.com" />
      <button id="send-otp-btn">Send OTP</button>
    </div>

    <!-- Step 2: OTP entry (hidden until an OTP has been sent) -->
    <div id="otp-step" class="hidden">
      <label for="otp">Enter OTP</label>
      <input type="text" id="otp" placeholder="6-digit code" maxlength="6" />
      <button id="verify-otp-btn">Verify OTP</button>
    </div>

    <p id="message" class="message"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
