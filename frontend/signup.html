<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - Email OTP Authentication</title>

  <link rel="stylesheet" href="style.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

  <div class="card">

    <h1>Sign Up</h1>
    <p class="subtitle">Create an account to get started.</p>

    <div id="signup-step">

      <label for="signup-email">Email address</label>
      <input type="email" id="signup-email" placeholder="you@example.com">

      <label for="signup-username">Username</label>
      <input type="text" id="signup-username" placeholder="Your username">

      <label for="signup-dob">Date of birth</label>
      <input type="date" id="signup-dob">

      <label for="signup-password">Password</label>

      <div class="password-wrapper">
        <input type="password" id="signup-password" placeholder="At least 6 characters">

        <i class="fa-solid fa-eye toggle-password" id="togglePassword">
        </i>
      </div>

      <label for="signup-confirm-password">
        Re-enter password
      </label>

      <div class="password-wrapper">
        <input type="password" id="signup-confirm-password" placeholder="Re-enter your password">

        <i class="fa-solid fa-eye toggle-password" id="toggleConfirmPassword">
        </i>
      </div>

      <button id="signup-btn">
        Sign Up
      </button>

    </div>

    <p id="message" class="message"></p>

    <p class="link-row">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

  </div>

  <script src="signup.js"></script>

</body>

</html>
